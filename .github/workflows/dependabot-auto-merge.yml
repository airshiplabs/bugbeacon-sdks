# Enables GitHub auto-merge for every Dependabot pull request once required
# checks pass. No update-type filter: major, minor, patch, production,
# development, and GitHub Actions all qualify.
#
# pull_request_target runs the base branch's copy of this file with a write
# token. This workflow does not check out or run pull request code.
#
# Protect main allows only squash. Repository settings also allow merge and
# rebase, so the merge method is set explicitly.
name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          echo "Enabling auto-merge for update-type=${UPDATE_TYPE}."
          gh pr merge --auto --squash "$PR_URL"
